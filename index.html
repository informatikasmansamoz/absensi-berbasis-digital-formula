<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04070F" />
<meta name="description" content="FORMULA SMAN 1 Mojosari — Portal Absensi Digital." />
<meta name="color-scheme" content="dark" />
<title>FORMULA — SMAN 1 Mojosari</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231A73E8'/%3E%3Ctext x='50' y='70' font-family='Arial' font-size='58' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --primary: #1A73E8;
  --primary-dark: #1557B0;
  --primary-light: #4DA3FF;
  --secondary: #34A853;
  --accent: #7C4DFF;
  --warning: #FBBC04;

  --bg-0: #02040A;
  --bg-1: #060B18;
  --bg-2: #0A1224;

  --text-hi: #FFFFFF;
  --text-mid: rgba(230, 237, 243, 0.7);
  --text-lo: rgba(230, 237, 243, 0.35);
  --text-dim: rgba(230, 237, 243, 0.15);

  --font-heading: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text-mid);
  background: var(--bg-0);
  overflow: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: grid;
  place-items: center;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

::selection { background: var(--primary); color: #fff; }
:focus-visible { outline: 2px solid var(--primary-light); outline-offset: 3px; border-radius: 6px; }

/* ============================================================
   CANVAS — ambient particles (background layer)
   ============================================================ */
#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ============================================================
   BG GRADIENT — animated radial glow
   ============================================================ */
.bg-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(26, 115, 232, 0.15), transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 70%, rgba(124, 77, 255, 0.12), transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(52, 168, 83, 0.08), transparent 70%);
  animation: glowShift 18s ease-in-out infinite;
}

@keyframes glowShift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-3%, 2%) scale(1.1); }
}

/* ============================================================
   SCAN BEAM — horizontal sweep
   ============================================================ */
.scan-beam {
  position: fixed;
  top: 0;
  left: -30%;
  width: 30%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(77, 163, 255, 0.03) 40%,
    rgba(77, 163, 255, 0.12) 50%,
    rgba(77, 163, 255, 0.03) 60%,
    transparent 100%);
  filter: blur(20px);
  animation: scanSweep 7s var(--ease-in-out) infinite;
  opacity: 0;
}

.scan-beam.active { opacity: 1; }

@keyframes scanSweep {
  0%   { left: -30%; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { left: 100%; opacity: 0; }
}

/* ============================================================
   STAGE 1 — CINEMATIC INTRO
   ============================================================ */
.intro {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 24px;
  transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out), filter 0.9s var(--ease-out);
}

.intro.exit {
  opacity: 0;
  transform: scale(1.15);
  filter: blur(12px);
  pointer-events: none;
}

.intro-inner {
  position: relative;
  text-align: center;
  max-width: 800px;
  width: 100%;
}

/* Orbit ring di belakang brand */
.orbit-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 320px;
  height: 320px;
  pointer-events: none;
  opacity: 0;
  animation: orbitFadeIn 1.2s 0.4s var(--ease-out) forwards;
}

@keyframes orbitFadeIn {
  to { opacity: 1; }
}

.orbit {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(77, 163, 255, 0.2);
  border-top-color: rgba(77, 163, 255, 0.7);
  animation: spin 3.5s linear infinite;
}

.orbit-2 {
  inset: 30px;
  border: 1px dashed rgba(124, 77, 255, 0.25);
  border-bottom-color: rgba(124, 77, 255, 0.7);
  animation: spin 5s linear infinite reverse;
}

.orbit-3 {
  inset: 60px;
  border: 1px solid rgba(52, 168, 83, 0.2);
  border-left-color: rgba(52, 168, 83, 0.6);
  animation: spin 4s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Brand: FORMULA — per huruf */
.brand {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: clamp(42px, 9vw, 88px);
  letter-spacing: -0.05em;
  line-height: 1;
  color: #fff;
  z-index: 2;
  filter: drop-shadow(0 0 32px rgba(26, 115, 232, 0.5));
}

.brand-letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(60px) rotateX(-40deg);
  filter: blur(8px);
  animation: letterReveal 1.1s var(--ease-out) forwards;
  background: linear-gradient(180deg, #FFFFFF 0%, #B8D4FF 60%, #4DA3FF 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

@keyframes letterReveal {
  0% {
    opacity: 0;
    transform: translateY(60px) rotateX(-40deg);
    filter: blur(8px);
  }
  60% {
    opacity: 1;
    filter: blur(0);
  }
  100% {
    opacity: 1;
    transform: translateY(0) rotateX(0);
    filter: blur(0);
  }
}

.brand-letter:nth-child(1) { animation-delay: 0.15s; }
.brand-letter:nth-child(2) { animation-delay: 0.25s; }
.brand-letter:nth-child(3) { animation-delay: 0.35s; }
.brand-letter:nth-child(4) { animation-delay: 0.45s; }
.brand-letter:nth-child(5) { animation-delay: 0.55s; }
.brand-letter:nth-child(6) { animation-delay: 0.65s; }
.brand-letter:nth-child(7) { animation-delay: 0.75s; }

/* Subtitle dengan SVG stroke drawing */
.subtitle-wrap {
  margin-top: 20px;
  opacity: 0;
  animation: fadeSlideUp 0.9s 1.2s var(--ease-out) forwards;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.subtitle-svg {
  display: block;
  width: min(320px, 80vw);
  height: auto;
  margin: 0 auto;
}

.subtitle-svg path {
  fill: none;
  stroke: rgba(77, 163, 255, 0.5);
  stroke-width: 1;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  animation: drawLine 1.4s 1.4s var(--ease-out) forwards;
}

.subtitle-svg path:nth-child(2) {
  stroke: rgba(52, 168, 83, 0.5);
  animation-delay: 1.7s;
}

@keyframes drawLine {
  to { stroke-dashoffset: 0; }
}

.subtitle-text {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: clamp(10px, 1.6vw, 12px);
  letter-spacing: 0.35em;
  color: var(--text-lo);
  text-transform: uppercase;
  font-weight: 500;
}

/* Progress bar minimalis di bawah */
.intro-progress {
  position: absolute;
  bottom: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: min(320px, 70vw);
  opacity: 0;
  animation: fadeSlideUp 0.6s 1.8s var(--ease-out) forwards;
}

.intro-progress-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-lo);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.intro-progress-count {
  color: var(--primary-light);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}

.intro-progress-track {
  height: 2px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.intro-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--secondary));
  background-size: 200% 100%;
  border-radius: 999px;
  animation: gradientFlow 1.5s linear infinite;
  box-shadow: 0 0 12px rgba(77, 163, 255, 0.7);
  transition: width 0.15s linear;
}

@keyframes gradientFlow {
  0%   { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

/* Status text berganti */
.intro-status {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-lo);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  min-height: 16px;
  text-align: center;
}

.intro-status-text {
  display: inline-block;
  transition: opacity 0.3s, transform 0.3s;
}

.intro-status-text.swap {
  opacity: 0;
  transform: translateY(-4px);
}

/* ============================================================
   STAGE 2 — LOGIN
   ============================================================ */
.login {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.94);
  width: 100%;
  max-width: 420px;
  padding: 24px;
  text-align: center;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s var(--ease-out), transform 1s var(--ease-spring);
}

.login.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}

/* Logo dengan conic ring */
.logo-stage {
  position: relative;
  display: inline-block;
  margin-bottom: 32px;
  width: 108px;
  height: 108px;
}

.logo-conic {
  position: absolute;
  inset: -10px;
  border-radius: 32px;
  background: conic-gradient(
    from 0deg,
    transparent 0%,
    rgba(77, 163, 255, 0.6) 20%,
    rgba(124, 77, 255, 0.5) 40%,
    rgba(52, 168, 83, 0.5) 60%,
    transparent 80%
  );
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  animation: spin 4s linear infinite;
  filter: blur(0.5px);
  opacity: 0;
  transition: opacity 0.6s;
}

.login.show .logo-conic { opacity: 1; }

.logo-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  border-radius: 32px;
}

.logo-mark {
  width: 100%;
  height: 100%;
  border-radius: 28px;
  background: linear-gradient(135deg, #1A73E8 0%, #4285F4 50%, #34A853 130%);
  color: #fff;
  display: grid;
  place-items: center;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 54px;
  letter-spacing: -0.04em;
  box-shadow:
    0 20px 60px rgba(26, 115, 232, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.1) inset,
    0 0 0 8px rgba(26, 115, 232, 0.08);
  transition: transform 0.15s var(--ease-spring), box-shadow 0.3s;
  position: relative;
  z-index: 2;
}

.logo-wrap:hover .logo-mark {
  transform: translateY(-2px);
  box-shadow:
    0 24px 68px rgba(26, 115, 232, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.1) inset,
    0 0 0 8px rgba(26, 115, 232, 0.1);
}

.logo-wrap:active .logo-mark { transform: scale(0.94); }

/* Ripple */
.ripple {
  position: absolute;
  inset: 0;
  border-radius: 28px;
  border: 2px solid rgba(77, 163, 255, 0.6);
  opacity: 0;
  pointer-events: none;
}

.ripple.go { animation: rippleOut 0.8s var(--ease-out); }

@keyframes rippleOut {
  0%   { opacity: 0.9; transform: scale(1); }
  100% { opacity: 0;   transform: scale(2.2); }
}

/* Title */
.login h1 {
  font-family: var(--font-heading);
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.login p.sub {
  font-size: 14px;
  color: var(--text-mid);
  margin-bottom: 32px;
  line-height: 1.6;
}

/* Button */
.btn-main {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 24px;
  font-family: var(--font-heading);
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #1A73E8, #4285F4);
  border-radius: 14px;
  box-shadow:
    0 8px 24px rgba(26, 115, 232, 0.45),
    0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  transition: transform 0.22s var(--ease-out), box-shadow 0.22s var(--ease-out);
  position: relative;
  overflow: hidden;
  min-height: 52px;
  width: 100%;
}

.btn-main::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
  transition: left 0.7s var(--ease-out);
}

.btn-main:hover:not(:disabled)::after { left: 100%; }

.btn-main:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow:
    0 12px 32px rgba(26, 115, 232, 0.55),
    0 0 0 1px rgba(255, 255, 255, 0.08) inset;
}

.btn-main:active:not(:disabled) { transform: translateY(0) scale(0.98); }
.btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-main svg { width: 18px; height: 18px; flex-shrink: 0; }

.btn-main > * { position: relative; z-index: 1; }

/* Hint */
.hint {
  font-size: 12px;
  color: var(--text-lo);
  line-height: 1.6;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 20px;
  transition: color 0.3s, transform 0.2s var(--ease-spring);
  min-height: 20px;
}

.hint.active {
  color: var(--primary-light);
  font-weight: 600;
  transform: scale(1.02);
}

.hint svg { width: 14px; height: 14px; flex-shrink: 0; }

/* Dots */
.dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 12px;
  min-height: 8px;
}

.dots .d {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  transition: all 0.3s var(--ease-spring);
}

.dots .d.on {
  background: var(--primary-light);
  box-shadow: 0 0 10px rgba(77, 163, 255, 0.9);
  transform: scale(1.4);
}

/* ============================================================
   REDIRECT OVERLAY
   ============================================================ */
.redirect-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2, 4, 10, 0.97);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
}

.redirect-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.redirect-inner {
  text-align: center;
  color: #fff;
  font-family: var(--font-mono);
  padding: 24px;
  max-width: 90vw;
}

.redirect-ring {
  width: 56px;
  height: 56px;
  margin: 0 auto 24px;
  border-radius: 50%;
  border: 2px solid rgba(77, 163, 255, 0.15);
  border-top-color: var(--primary-light);
  border-right-color: rgba(124, 77, 255, 0.6);
  animation: spin 0.9s linear infinite;
}

.redirect-label {
  color: var(--text-mid);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-size: 10px;
  margin-bottom: 8px;
}

.redirect-target {
  color: var(--primary-light);
  font-weight: 700;
  font-size: 12px;
  word-break: break-all;
  max-width: 280px;
  margin: 0 auto;
}

/* ============================================================
   WATERMARK
   ============================================================ */
.watermark {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(255, 255, 255, 0.2);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.watermark .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--secondary);
  box-shadow: 0 0 8px rgba(52, 168, 83, 0.9);
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.8); }
}

/* ============================================================
   SKIP HINT
   ============================================================ */
.skip-hint {
  position: fixed;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 11;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: opacity 0.4s;
  pointer-events: none;
  text-align: center;
}

.skip-hint kbd {
  display: inline-block;
  padding: 2px 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  margin: 0 2px;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 480px) {
  .orbit-wrap { width: 240px; height: 240px; }
  .brand { font-size: clamp(38px, 13vw, 62px); }
  .logo-stage { width: 92px; height: 92px; }
  .logo-mark { font-size: 46px; border-radius: 24px; }
  .logo-conic { inset: -8px; border-radius: 28px; }
  .login h1 { font-size: 21px; }
  .login p.sub { margin-bottom: 28px; }
  .skip-hint { display: none; }
  .intro-progress { bottom: -100px; }
}

@media (max-height: 640px) {
  .logo-stage { width: 84px; height: 84px; margin-bottom: 24px; }
  .logo-mark { font-size: 42px; border-radius: 22px; }
  .logo-conic { border-radius: 26px; }
  .intro-progress { bottom: -80px; }
  .brand { font-size: clamp(36px, 8vw, 64px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .intro { display: none !important; }
  .login { opacity: 1 !important; transform: translate(-50%, -50%) scale(1) !important; pointer-events: auto !important; }
  .scan-beam, .bg-glow { display: none; }
}
</style>
</head>
<body>

<!-- Canvas particles -->
<canvas id="bgCanvas" aria-hidden="true"></canvas>

<!-- Ambient glow -->
<div class="bg-glow" aria-hidden="true"></div>

<!-- Scan beam -->
<div class="scan-beam active" id="scanBeam" aria-hidden="true"></div>

<!-- ============================================================
     STAGE 1 — CINEMATIC INTRO
============================================================ -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-inner">

    <!-- Orbit rings -->
    <div class="orbit-wrap" aria-hidden="true">
      <div class="orbit"></div>
      <div class="orbit orbit-2"></div>
      <div class="orbit orbit-3"></div>
    </div>

    <!-- Brand: FORMULA per huruf -->
    <div class="brand" aria-label="FORMULA">
      <span class="brand-letter">F</span>
      <span class="brand-letter">O</span>
      <span class="brand-letter">R</span>
      <span class="brand-letter">M</span>
      <span class="brand-letter">U</span>
      <span class="brand-letter">L</span>
      <span class="brand-letter">A</span>
    </div>

    <!-- Subtitle -->
    <div class="subtitle-wrap">
      <svg class="subtitle-svg" viewBox="0 0 400 20" aria-hidden="true">
        <path d="M 0 10 L 180 10" />
        <path d="M 220 10 L 400 10" />
      </svg>
      <div class="subtitle-text">SMAN 1 Mojosari</div>
    </div>

    <!-- Progress -->
    <div class="intro-progress">
      <div class="intro-progress-head">
        <span id="introLabel">INITIALIZING</span>
        <span class="intro-progress-count" id="introCount">0%</span>
      </div>
      <div class="intro-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="introRole">
        <div class="intro-progress-fill" id="introFill"></div>
      </div>
      <div class="intro-status">
        <span class="intro-status-text" id="introStatus">Memuat sumber daya...</span>
      </div>
    </div>

  </div>
</div>

<!-- ============================================================
     STAGE 2 — LOGIN
============================================================ -->
<div class="login" id="login" aria-hidden="true">

  <div class="logo-stage">
    <div class="logo-conic" aria-hidden="true"></div>
    <div class="logo-wrap" id="logoWrap" role="button" tabindex="0" aria-label="Logo FORMULA — ketuk 5 kali untuk akses admin">
      <div class="ripple" id="ripple" aria-hidden="true"></div>
      <div class="logo-mark" aria-hidden="true">F</div>
    </div>
  </div>

  <h1>FORMULA</h1>
  <p class="sub">Sman 1 Mojosari<br>Informatika &amp; Multimedia</p>

  <button class="btn-main" id="btnUser" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span>Masuk Portal</span>
  </button>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 16v-4"/>
      <path d="M12 8h.01"/>
    </svg>
    <span id="hintText">Ketuk logo 5× untuk akses admin</span>
  </div>
  <div class="dots" id="dots" aria-hidden="true">
    <span class="d"></span>
    <span class="d"></span>
    <span class="d"></span>
    <span class="d"></span>
    <span class="d"></span>
  </div>

</div>

<!-- ============================================================
     REDIRECT OVERLAY
============================================================ -->
<div class="redirect-overlay" id="redirectOverlay" role="alert" aria-live="assertive">
  <div class="redirect-inner">
    <div class="redirect-ring" aria-hidden="true"></div>
    <div class="redirect-label">Mengalihkan ke</div>
    <div class="redirect-target" id="redirectTarget">—</div>
  </div>
</div>

<!-- Skip hint -->
<div class="skip-hint" id="skipHint" aria-hidden="true">
  Tekan <kbd>Enter</kbd> untuk lewati
</div>

<!-- Watermark -->
<div class="watermark" aria-hidden="true">
  <span class="dot"></span>
  <span>Secure Portal</span>
</div>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#02040A;color:#fff;font-family:system-ui;padding:24px;text-align:center;z-index:9999;">
    <div>
      <h2 style="margin-bottom:12px;">JavaScript Diperlukan</h2>
      <p style="opacity:0.7;font-size:14px;">Aktifkan JavaScript untuk membuka portal.</p>
    </div>
  </div>
</noscript>

<script>
(function () {
  'use strict';

  /* ============================================================
     KONFIGURASI
     ============================================================ */
  const USER_URL  = 'https://absensi-formula-sman1mojosari.base44.app/user';
  const ADMIN_URL = 'https://absensi-formula-sman1mojosari.base44.app/admin';
  const INTRO_DURATION = 6500;
  const CLICKS_FOR_ADMIN = 5;
  const REDIRECT_DELAY = 700;
  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================================
     DOM
     ============================================================ */
  const intro         = document.getElementById('intro');
  const introFill     = document.getElementById('introFill');
  const introCount    = document.getElementById('introCount');
  const introLabel    = document.getElementById('introLabel');
  const introRole     = document.getElementById('introRole');
  const introStatus   = document.getElementById('introStatus');
  const skipHint      = document.getElementById('skipHint');
  const login         = document.getElementById('login');
  const logoWrap      = document.getElementById('logoWrap');
  const ripple        = document.getElementById('ripple');
  const hint          = document.getElementById('hint');
  const hintText      = document.getElementById('hintText');
  const dots          = document.querySelectorAll('#dots .d');
  const btnUser       = document.getElementById('btnUser');
  const redirectOverlay = document.getElementById('redirectOverlay');
  const redirectTarget  = document.getElementById('redirectTarget');

  /* ============================================================
     STATE
     ============================================================ */
  let introDone = false;
  let redirecting = false;
  let introTimer = null;
  let introRaf = null;
  let introStartTime = 0;
  let clickCount = 0;
  let clickTimer = null;

  /* ============================================================
     PARTICLE CANVAS — ambient floating dots
     ============================================================ */
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let canvasRaf = null;
  let dpr = 1;

  const initCanvas = () => {
    if (!canvas || !ctx) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const resize = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      spawnParticles(w, h);
    };
    resize();
    window.addEventListener('resize', resize, { passive: true });
  };

  const spawnParticles = (w, h) => {
    const count = Math.min(80, Math.floor((w * h) / 18000));
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.4,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        a: Math.random() * 0.6 + 0.1,
        color: Math.random() > 0.7
          ? 'rgba(77, 163, 255, 1)'
          : Math.random() > 0.5
            ? 'rgba(124, 77, 255, 1)'
            : 'rgba(255, 255, 255, 1)',
        pulse: Math.random() * Math.PI * 2
      });
    }
  };

  const drawParticles = (t) => {
    if (!ctx || !canvas) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.pulse += 0.02;

      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10;
      if (p.y > h + 10) p.y = -10;

      const alpha = p.a * (0.6 + 0.4 * Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color.replace('1)', alpha + ')');
      ctx.fill();

      // Glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, p.color.replace('1)', alpha * 0.3 + ')'));
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fill();
    }

    canvasRaf = requestAnimationFrame(drawParticles);
  };

  if (!REDUCED_MOTION) {
    initCanvas();
    drawParticles(0);
  }

  /* ============================================================
     INTRO PROGRESS
     ============================================================ */
  const STATUS_MESSAGES = [
    { at: 0,    label: 'INITIALIZING', text: 'Memuat sumber daya...' },
    { at: 15,   label: 'LOADING',      text: 'Menyiapkan modul inti...' },
    { at: 35,   label: 'CONNECTING',   text: 'Menghubungkan ke server...' },
    { at: 55,   label: 'SYNCING',      text: 'Sinkronisasi data...' },
    { at: 75,   label: 'VERIFYING',    text: 'Memverifikasi sesi...' },
    { at: 90,   label: 'FINALIZING',   text: 'Menyelesaikan...' }
  ];

  let currentStatusIdx = -1;

  const updateStatus = (progress) => {
    let idx = 0;
    for (let i = 0; i < STATUS_MESSAGES.length; i++) {
      if (progress >= STATUS_MESSAGES[i].at) idx = i;
    }
    if (idx === currentStatusIdx) return;
    currentStatusIdx = idx;

    const msg = STATUS_MESSAGES[idx];
    introLabel.textContent = msg.label;

    introStatus.classList.add('swap');
    setTimeout(() => {
      introStatus.textContent = msg.text;
      introStatus.classList.remove('swap');
    }, 150);
  };

  const setIntroProgress = (p) => {
    const v = Math.max(0, Math.min(100, p));
    if (introFill) introFill.style.width = v + '%';
    if (introCount) introCount.textContent = Math.round(v) + '%';
    if (introRole) introRole.setAttribute('aria-valuenow', String(Math.round(v)));
    updateStatus(v);
  };

  /* ============================================================
     INTRO ANIMATION LOOP
     ============================================================ */
  const startIntroAnimation = () => {
    introStartTime = performance.now();
    const duration = INTRO_DURATION;

    const tick = () => {
      const elapsed = performance.now() - introStartTime;
      let p = elapsed / duration * 100;

      // Easing: cepat di awal, melambat di akhir
      if (p < 30) p = p * 0.9;
      if (p > 85) p = 85 + (p - 85) * 0.5;

      setIntroProgress(p);

      if (elapsed < duration) {
        introRaf = requestAnimationFrame(tick);
      } else {
        setIntroProgress(100);
        setTimeout(goToLogin, 400);
      }
    };
    introRaf = requestAnimationFrame(tick);
  };

  /* ============================================================
     TRANSISI INTRO → LOGIN
     ============================================================ */
  const goToLogin = () => {
    if (introDone) return;
    introDone = true;

    if (introRaf) cancelAnimationFrame(introRaf);
    if (introTimer) clearTimeout(introTimer);

    if (skipHint) skipHint.style.opacity = '0';
    if (intro) intro.classList.add('exit');

    setTimeout(() => {
      if (intro) intro.style.display = 'none';
      if (login) {
        login.classList.add('show');
        login.setAttribute('aria-hidden', 'false');
      }
    }, 700);
  };

  const skipIntro = () => {
    if (introDone || redirecting) return;
    setIntroProgress(100);
    setTimeout(goToLogin, 200);
  };

  /* ============================================================
     REDIRECT
     ============================================================ */
  const goTo = (url) => {
    if (redirecting) return;
    redirecting = true;

    if (redirectTarget) redirectTarget.textContent = url;
    if (redirectOverlay) redirectOverlay.classList.add('show');
    if (btnUser) btnUser.disabled = true;

    setTimeout(() => {
      window.location.href = url;
    }, REDIRECT_DELAY);
  };

  /* ============================================================
     LOGO CLICK (5× ADMIN)
     ============================================================ */
  const resetClicks = () => {
    clickCount = 0;
    dots.forEach(d => d.classList.remove('on'));
    if (hint) hint.classList.remove('active');
    if (hintText) hintText.textContent = 'Ketuk logo 5× untuk akses admin';
  };

  const handleLogoClick = () => {
    if (redirecting) return;

    if (ripple) {
      ripple.classList.remove('go');
      void ripple.offsetWidth;
      ripple.classList.add('go');
    }

    if (navigator.vibrate) {
      try { navigator.vibrate(25); } catch (_) {}
    }

    clickCount++;
    const sisa = CLICKS_FOR_ADMIN - clickCount;

    dots.forEach((d, i) => d.classList.toggle('on', i < clickCount));

    if (hint) hint.classList.add('active');
    if (hintText) {
      hintText.textContent = sisa > 0
        ? 'Ketuk ' + sisa + '× lagi...'
        : 'Membuka akses admin...';
    }

    clearTimeout(clickTimer);
    if (sisa > 0) {
      clickTimer = setTimeout(resetClicks, 2000);
    }

    if (clickCount >= CLICKS_FOR_ADMIN) {
      clearTimeout(clickTimer);
      setTimeout(() => goTo(ADMIN_URL), 280);
    }
  };

  if (logoWrap) {
    logoWrap.addEventListener('click', handleLogoClick);
    logoWrap.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleLogoClick();
      }
    });
  }

  /* ============================================================
     BUTTON
     ============================================================ */
  if (btnUser) {
    btnUser.addEventListener('click', () => goTo(USER_URL));
  }

  /* ============================================================
     SKIP HANDLERS
     ============================================================ */
  const handleKey = (e) => {
    if (!introDone && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag !== 'BUTTON' && tag !== 'A') {
        e.preventDefault();
        skipIntro();
      }
    }
  };
  document.addEventListener('keydown', handleKey);

  if (intro) {
    intro.addEventListener('click', skipIntro);
    intro.style.cursor = 'pointer';
  }

  /* ============================================================
     QUERY PARAM SKIP
     ============================================================ */
  let role = null;
  try {
    role = new URLSearchParams(location.search).get('role');
  } catch (_) {}

  if (role === 'admin') {
    goToLogin();
    setTimeout(() => goTo(ADMIN_URL), 300);
  } else if (role === 'user') {
    goToLogin();
    setTimeout(() => goTo(USER_URL), 300);
  } else if (REDUCED_MOTION) {
    goToLogin();
  } else {
    startIntroAnimation();
    introTimer = setTimeout(goToLogin, INTRO_DURATION + 500);
  }

  /* ============================================================
     SAFETY
     ============================================================ */
  window.addEventListener('error', () => {
    if (!introDone && !redirecting) {
      try { goToLogin(); } catch (_) {}
    }
  });

  window.addEventListener('beforeunload', () => {
    if (introRaf) cancelAnimationFrame(introRaf);
    if (canvasRaf) cancelAnimationFrame(canvasRaf);
    if (introTimer) clearTimeout(introTimer);
    if (clickTimer) clearTimeout(clickTimer);
  });

})();
</script>
